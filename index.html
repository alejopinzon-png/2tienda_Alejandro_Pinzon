<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #1a1a2e;
      --card-border: #2e2e52;
      --texto: #e6e6ff;
      --texto-suave: #9a9acb;
      --neon-cyan: #00f5d4;
      --neon-rosa: #ff00cc;
      --neon-morado: #7b2ff7;
      --peligro: #ff3860;
    }

    body {
      font-family: system-ui, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b1740 0%, var(--bg) 60%);
      background-attachment: fixed;
      color: var(--texto);
      padding: 20px;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 25px var(--neon-cyan);
    }

    .slogan {
      color: var(--texto-suave);
      font-size: 17px;
      margin-top: 0;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Beneficios de la tienda */

    .beneficios {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;

      background: linear-gradient(90deg, #14143a, #2a1450, #14143a);
      color: var(--neon-cyan);
      border-top: 1px solid var(--neon-cyan);
      border-bottom: 1px solid var(--neon-rosa);
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.25);

      padding: 14px;
      margin-bottom: 30px;
    }

    .beneficios span {
      font-size: 14px;
      font-weight: 600;
    }

    /* Catálogo */

    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .producto {
      border: 1px solid var(--card-border);
      background: var(--card);
      border-radius: 10px;
      padding: 10px;
      width: 220px;
      vertical-align: top;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .producto:hover {
      transform: translateY(-6px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.45);
    }

    .producto img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }

    .producto h3 {
      margin-bottom: 8px;
      color: #fff;
    }

    .descripcion {
      font-size: 14px;
      color: var(--texto-suave);
      min-height: 42px;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 245, 212, 0.6);
    }

    /* Botones */

    .producto button {
      background: linear-gradient(90deg, var(--neon-morado), var(--neon-rosa));
      border: none;
      color: white;
      font-weight: 600;
      padding: 9px 14px;
      margin-top: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .producto button:hover {
      box-shadow: 0 0 14px var(--neon-rosa);
      transform: scale(1.05);
    }

    /* Carrito */

    .carrito {
      margin-top: 35px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--neon-morado);
      box-shadow: 0 0 20px rgba(123, 47, 247, 0.4);
      border-radius: 10px;
      text-align: left;
      display: inline-block;
      min-width: 320px;
    }

    .carrito h2 {
      margin-top: 0;
      color: var(--neon-cyan);
    }

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 8px;
    }

    .resumen {
      border-top: 1px solid var(--card-border);
      margin-top: 15px;
      padding-top: 10px;
    }

    .total {
      font-size: 19px;
      color: var(--neon-cyan);
    }

    /* Botón vaciar */

    .vaciar {
      background: transparent;
      border: 2px solid var(--peligro);
      color: var(--peligro);
      font-weight: 600;
      padding: 7px 12px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .vaciar:hover {
      background: var(--peligro);
      color: #fff;
      box-shadow: 0 0 14px var(--peligro);
    }

    /* Botón finalizar */

    .finalizar {
      background: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      color: #0d0d1a;
      font-weight: 700;
      padding: 7px 12px;
      margin-top: 10px;
      margin-left: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .finalizar:hover {
      box-shadow: 0 0 16px var(--neon-cyan);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1 class="logo">🎮 Ale<span>Game</span>Steam</h1>
    <p class="slogan">Tu próximo nivel empieza aquí 🕹️</p>
  </header>

  <style>
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      border-bottom: 4px solid #00f5d4;
    }

    .logo {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 10px #00f5d4, 0 0 25px #00f5d4;
      margin: 0;
    }

    .logo span {
      background: linear-gradient(90deg, #ff00cc, #00f5d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .slogan {
      color: #b8b8ff;
      font-size: 1.1rem;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>

  <p class="slogan">
    Los mejores juegos de la web a un clic de distancia 🎮
  </p>

  <div class="beneficios">
    <span>🚚 Disponibilidad Mundial</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de compra</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
    

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Hollow knight silksong",
        descripcion: "“Entra al reino. Desafía tus límites. Vive Silksong.”",
        precio: 47500,
        imagen: "https://thumb.wikimedia.org/wikipedia/en/thumb/0/05/Silksong.jpg/250px-Silksong.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail"
      },
      {
        id: 2,
        nombre: "Gamble With Your Friends",
        descripcion: "Apuesta, ríe y descubre quién conoce mejor a sus amigos.",
        precio: 21000,
        imagen: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3892270/78a9deef0ef784825518781a668724e219099d1f/capsule_616x353.jpg?t=1790878645"
      },
      {
        id: 3,
        nombre: "Golf it",
        descripcion: "“Apunta, golpea y supera a tus amigos.”",
        precio: 21500,
        imagen: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/571740/capsule_616x353.jpg?t=1790080653"
      },
      {
        id: 4,
        nombre: "Cult of the lamb",
        descripcion: "Crea tu culto, conquista el mundo.",
        precio: 70000,
        imagen: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1313140/cb5ff4e1c40adac0ea71aace62c3020a25f29d50/capsule_616x353.jpg?t=1786554901"
      },
      {
        id: 5,
        nombre: "Raft",
        descripcion: "Sobrevive al mar. Construye tu destino.",
        precio: 49000,
        imagen: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/648800/capsule_616x353.jpg?t=1727184011"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
